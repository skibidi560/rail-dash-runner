
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rail Dash</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101827;
    color: white;
    font-family: system-ui, sans-serif;
}
#wrap {
    position: relative;
    width: 100%;
    height: 780px;
    max-height: 100vh;
    min-height: 540px;
    overflow: hidden;
    border-radius: 16px;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}
.hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}
.pill {
    background: #09192cdd;
    border: 1px solid #ffffff44;
    border-radius: 12px;
    padding: 8px 12px;
    font-weight: 800;
}
.small {
    color: #b9d4eb;
    font-size: 10px;
    letter-spacing: 1px;
}
.big { font-size: 21px; }
#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #061426a8;
}
.panel {
    width: min(450px, 96%);
    padding: 25px 20px;
    text-align: center;
    background: #10263ef5;
    border: 1px solid #ffffff44;
    border-radius: 24px;
}
.logo {
    font-size: clamp(38px, 8vw, 60px);
    font-weight: 1000;
    letter-spacing: -2px;
}
.logo span { color: #ffd34f; }
p { color: #c6d9ec; line-height: 1.5; }
button {
    border: 0;
    border-radius: 13px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
}
#start {
    background: linear-gradient(#ffe58a, #ffbd38);
    color: #142338;
    width: 100%;
}
#pause {
    position: absolute;
    top: 82px;
    right: 12px;
    padding: 9px 13px;
    color: white;
    background: #09192cdd;
    border: 1px solid #ffffff44;
}
#mobile {
    position: absolute;
    bottom: 14px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
}
.pad { display: flex; gap: 7px; }
.ctrl {
    width: 53px;
    height: 52px;
    padding: 0;
    color: white;
    background: #09192cdd;
    border: 1px solid #ffffff66;
    touch-action: manipulation;
}
.ctrl.action {
    background: #ffd34f;
    color: #10263e;
}
@media(max-width: 520px) {
    #wrap { min-height: 520px; }
    .pill { padding: 6px 8px; }
    .big { font-size: 18px; }
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill">
    <div class="small">ĐIỂM</div>
    <div class="big" id="score">0</div>
  </div>
  <div class="pill">
    <div class="small">XU 🟡</div>
    <div class="big" id="coins">0</div>
    <div class="small">KỶ LỤC <span id="best">0</span></div>
  </div>
</div>

<button id="pause">Ⅱ</button>

<div id="mobile">
  <div class="pad">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="pad">
    <button class="ctrl action" id="slide">▼</button>
    <button class="ctrl action" id="jump">▲</button>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <div style="font-size:42px">🚆 ✨</div>
    <div class="logo">RAIL <span>DASH</span></div>
    <p id="desc">
      Chạy qua đường ray, né tàu điện,
      nhảy qua rào chắn và nhặt xu!
    </p>
    <p style="font-size:12px">
      ← → đổi làn · ↑ nhảy · ↓ trượt
    </p>
    <button id="start">▶ CHƠI NGAY</button>
  </div>
</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

let W = 900, H = 700, dpr = 1;
let state = "menu";
let last = performance.now();
let time = 0, score = 0, coins = 0, speed = 0.34;
let lane = 1, visualLane = 1;
let jump = 0, jumpVelocity = 0, slide = 0;
let obstacles = [], coinItems = [];
let spawnTimer = 0.5, coinTimer = 0.4;

let best = Number(localStorage.getItem("raildash-best") || 0);
$("best").textContent = best;

function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width;
    H = r.height;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(canvas);
resize();

function project(l, z) {
    const horizon = H * 0.30;
    const bottom = H * 1.02;
    const half = W * (0.075 + 0.405 * z);
    return {
        x: W / 2 + (l - 1) * half * 0.64,
        y: horizon + (bottom - horizon) * z * z,
        s: 0.12 + z * 1.5
    };
}

function polygon(points, color) {
    ctx.beginPath();
    points.forEach((p, i) =>
        i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)
    );
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
}

function background() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#65c9ef");
    g.addColorStop(0.48, "#d2f5ef");
    g.addColorStop(1, "#507f83");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const hz = H * 0.30;

    ctx.fillStyle = "#fff2b0";
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.12, 28, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 15; i++) {
        const x = i * W / 14;
        const bh = H * (0.08 + (i % 5) * 0.025);
        ctx.fillStyle = i % 2 ? "#83c5d0" : "#a0d8d8";
        ctx.fillRect(x, hz - bh, W / 25, bh);
    }

    polygon([
        {x: W * 0.44, y: hz},
        {x: W * 0.56, y: hz},
        {x: W * 1.04, y: H},
        {x: -W * 0.04, y: H}
    ], "#777e8b");

    for (let i = 0; i < 23; i++) {
        const z = ((i / 23 + time * speed * 0.18) % 1);
        const y = hz + (H - hz) * z * z;
        const half = W * (0.075 + z * 0.405);
        ctx.fillStyle = "#594e4c";
        ctx.fillRect(W/2 - half, y, half * 2, 2 + z * 12);
    }

    for (let l = 0; l < 3; l++) {
        for (const side of [-1, 1]) {
            ctx.strokeStyle = "#dce4e8";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(W/2 + (l-1)*W*.075 + side*W*.018, hz);
            ctx.lineTo(W/2 + (l-1)*W*.48 + side*W*.12, H);
            ctx.stroke();
        }
    }

    for (let i = 0; i < 8; i++) {
        const z = (i / 8 + time * speed * 0.10) % 1;
        const y = hz + (H-hz)*z*z;
        const s = 0.15 + z;
        for (const side of [-1, 1]) {
            const x = W/2 + side*W*(0.12 + z*0.5);
            ctx.fillStyle = "#765a47";
            ctx.fillRect(x-4*s, y-42*s, 8*s, 42*s);
            ctx.fillStyle = i%2 ? "#278b63" : "#369b68";
            ctx.beginPath();
            ctx.arc(x, y-50*s, 22*s, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function obstacleDraw(o) {
    const p = project(o.lane, o.z);
    const x = p.x, y = p.y, s = p.s;

    if (o.type === "train") {
        const w = 70*s, h = 145*s;
        ctx.fillStyle = "#2479a8";
        ctx.fillRect(x-w/2, y-h, w, h);
        ctx.fillStyle = "#a3e9f4";
        ctx.fillRect(x-w*.39, y-h*.86, w*.78, h*.28);
        ctx.fillStyle = "#163e5c";
        for (let i=0; i<3; i++)
            ctx.fillRect(x-w*.36+i*w*.26, y-h*.5, w*.2, h*.18);
        ctx.fillStyle = "#ffcd52";
        ctx.fillRect(x-w*.38, y-h*.16, w*.76, h*.08);
    } else if (o.type === "barrier") {
        ctx.fillStyle = "#e9eff5";
        ctx.fillRect(x-31*s, y-29*s, 62*s, 29*s);
        ctx.fillStyle = "#e84e52";
        for (let i=0; i<4; i++)
            ctx.fillRect(x-29*s+i*16*s, y-28*s, 8*s, 27*s);
    } else {
        ctx.fillStyle = "#76533a";
        ctx.fillRect(x-36*s, y-65*s, 7*s, 65*s);
        ctx.fillRect(x+29*s, y-65*s, 7*s, 65*s);
        ctx.fillStyle = "#f0bd50";
        ctx.fillRect(x-42*s, y-70*s, 84*s, 16*s);
    }
}

function drawCoin(c) {
    const p = project(c.lane, c.z);
    ctx.fillStyle = "#a66a13";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y-24*p.s, 8*p.s, 12*p.s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#ffd94c";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y-25*p.s, 6*p.s, 10*p.s, 0, 0, Math.PI*2);
    ctx.fill();
}

function playerDraw() {
    const p = project(visualLane, 1);
    const x = p.x, y = H*.82 - jump*H*.2;
    const s = Math.max(.7, Math.min(1.2, W/650));

    ctx.fillStyle = "#07152455";
    ctx.beginPath();
    ctx.ellipse(p.x, H*.83, 22*s, 7*s, 0, 0, Math.PI*2);
    ctx.fill();

    if (slide > 0) {
        ctx.fillStyle = "#16a5b4";
        ctx.fillRect(x-25*s, y-25*s, 50*s, 23*s);
        ctx.fillStyle = "#f1bd8e";
        ctx.beginPath();
        ctx.arc(x+13*s, y-29*s, 10*s, 0, Math.PI*2);
        ctx.fill();
        return;
    }

    ctx.strokeStyle = "#25364b";
    ctx.lineWidth = 9*s;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x-7*s, y-18*s);
    ctx.lineTo(x-10*s, y-2*s);
    ctx.moveTo(x+7*s, y-18*s);
    ctx.lineTo(x+11*s, y-2*s);
    ctx.stroke();

    ctx.fillStyle = "#f7f7ef";
    ctx.fillRect(x-20*s, y-5*s, 18*s, 7*s);
    ctx.fillRect(x+3*s, y-5*s, 18*s, 7*s);

    ctx.fillStyle = "#ef5968";
    ctx.fillRect(x-19*s, y-60*s, 38*s, 43*s);
    ctx.fillStyle = "#276d9c";
    ctx.fillRect(x-11*s, y-52*s, 22*s, 24*s);

    ctx.fillStyle = "#f1bd8e";
    ctx.beginPath();
    ctx.arc(x, y-75*s, 15*s, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#29354a";
    ctx.beginPath();
    ctx.arc(x, y-80*s, 15*s, Math.PI, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#36c3cf";
    ctx.fillRect(x-13*s, y-87*s, 26*s, 7*s);
}

function startGame() {
    state = "run";
    time = score = coins = 0;
    speed = .34;
    lane = visualLane = 1;
    jump = jumpVelocity = slide = 0;
    obstacles = [];
    coinItems = [];
    spawnTimer = .5;
    coinTimer = .4;
    $("overlay").style.display = "none";
    $("start").textContent = "▶ CHƠI NGAY";
    last = performance.now();
}

function endGame() {
    state = "over";
    best = Math.max(best, Math.floor(score));
    localStorage.setItem("raildash-best", best);
    $("best").textContent = best;
    $("desc").innerHTML =
        `Bạn đạt <b>${Math.floor(score)} điểm</b> và nhặt được <b>${coins} xu</b>!`;
    $("start").textContent = "↻ CHƠI LẠI";
    $("overlay").style.display = "flex";
}

function move(d) {
    if (state !== "run") return;
    lane = Math.max(0, Math.min(2, lane+d));
}
function doJump() {
    if (state === "run" && jump <= 0) {
        jumpVelocity = 1.1;
        jump = .02;
        slide = 0;
    }
}
function doSlide() {
    if (state === "run") {
        slide = .65;
        jump = jumpVelocity = 0;
    }
}
</script>
<script>
function update(dt) {
    if (state !== "run") return;

    time += dt;
    speed = Math.min(.72, .34 + time*.003);
    score += dt * (12 + speed*16);

    visualLane += (lane-visualLane)*Math.min(1,dt*12);

    if (jump > 0 || jumpVelocity > 0) {
        jump += jumpVelocity*dt*2.4;
        jumpVelocity -= 2.6*dt;
        if (jump < 0) {
            jump = 0;
            jumpVelocity = 0;
        }
    }
    slide = Math.max(0, slide-dt);

    spawnTimer -= dt;
    coinTimer -= dt;

    if (spawnTimer <= 0) {
        const r = Math.random();
        obstacles.push({
            lane: Math.floor(Math.random()*3),
            z: 0,
            type: r < .48 ? "train" :
                  r < .75 ? "barrier" : "low",
            hit: false
        });
        spawnTimer = Math.max(.5,1.25-time*.003)+Math.random()*.4;
    }

    if (coinTimer <= 0) {
        const l = Math.floor(Math.random()*3);
        for (let i=0; i<5; i++)
            coinItems.push({lane:l,z:-i*.085});
        coinTimer = 1.5+Math.random();
    }

    for (let i=obstacles.length-1; i>=0; i--) {
        const o = obstacles[i];
        o.z += speed*dt*.53;

        if (o.z > 1.12) {
            obstacles.splice(i,1);
            continue;
        }

        if (!o.hit && o.z>.84 && o.z<.99 &&
            o.lane===lane) {
            const safe =
                (o.type==="barrier" && jump>.48) ||
                (o.type==="low" && slide>.12);

            if (!safe) {
                endGame();
                return;
            }
            o.hit = true;
            score += 25;
        }
    }

    for (let i=coinItems.length-1; i>=0; i--) {
        const c = coinItems[i];
        c.z += speed*dt*.53;

        if (c.z > 1.1) {
            coinItems.splice(i,1);
            continue;
        }

        if (c.z>.85 && c.z<1.02 &&
            Math.abs(c.lane-visualLane)<.43) {
            coins++;
            score += 10;
            coinItems.splice(i,1);
        }
    }

    $("score").textContent = Math.floor(score);
    $("coins").textContent = coins;
    $("best").textContent = best;
}

function render() {
    background();

    obstacles
        .slice()
        .sort((a,b)=>a.z-b.z)
        .forEach(obstacleDraw);

    coinItems.forEach(drawCoin);
    playerDraw();
}

function loop(now) {
    const dt = Math.min(.04,(now-last)/1000 || 0);
    last = now;

    update(dt);
    render();
    requestAnimationFrame(loop);
}

$("start").addEventListener("click",startGame);

$("pause").addEventListener("click",()=>{
    if (state === "run") {
        state = "paused";
        $("desc").textContent = "Game đang tạm dừng.";
        $("start").textContent = "▶ TIẾP TỤC";
        $("overlay").style.display = "flex";
    } else if (state === "paused") {
        state = "run";
        $("overlay").style.display = "none";
        $("start").textContent = "▶ CHƠI NGAY";
        last = performance.now();
    }
});

$("left").addEventListener("click",()=>move(-1));
$("right").addEventListener("click",()=>move(1));
$("jump").addEventListener("click",doJump);
$("slide").addEventListener("click",doSlide);

window.addEventListener("keydown",e=>{
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))
        e.preventDefault();

    if (state === "menu" || state === "over") {
        if (e.key === "Enter" || e.key === " ") startGame();
        return;
    }

    switch(e.key) {
        case "ArrowLeft":
        case "a":
        case "A": move(-1); break;
        case "ArrowRight":
        case "d":
        case "D": move(1); break;
        case "ArrowUp":
        case "w":
        case "W":
        case " ": doJump(); break;
        case "ArrowDown":
        case "s":
        case "S": doSlide(); break;
        case "Escape":
            if (state==="run") {
                state="paused";
                $("desc").textContent="Game đang tạm dừng.";
                $("start").textContent="▶ TIẾP TỤC";
                $("overlay").style.display="flex";
            } else if (state==="paused") {
                state="run";
                $("overlay").style.display="none";
                last=performance.now();
            }
            break;
    }
});

let touchStart = null;
canvas.addEventListener("pointerdown",e=>{
    touchStart={x:e.clientX,y:e.clientY};
});
canvas.addEventListener("pointerup",e=>{
    if (!touchStart) return;

    const dx=e.clientX-touchStart.x;
    const dy=e.clientY-touchStart.y;

    if (Math.max(Math.abs(dx),Math.abs(dy))>25) {
        if (Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1);
        else if (dy<0) doJump();
        else doSlide();
    }
    touchStart=null;
});

last=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>

</body>
</html>
